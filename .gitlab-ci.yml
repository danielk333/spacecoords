# Official language image. Look for the different tagged releases at:
# https://hub.docker.com/r/library/python/tags/
image: python:3.11

stages:
  - test
  - type_checking
  - release

# Prepare the development environment
.devsetup:
  before_script:
    - python -V
    - pip install -U pip
    - python -m venv venv
    - source venv/bin/activate

# Rules to trigger standard jobs
.merge_request_rules:
  rules:
    - if: $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

#######################
## Platforms testing ##

pytest:
  stage: test
  image: ghcr.io/astral-sh/uv:bookworm-slim
  allow_failure: true
  parallel:
    matrix:
      - VERSION: ["3.10", "3.11", "3.12", "3.13"]
  script:
    - uv python install $VERSION
    - uv venv --python $VERSION
    - source .venv/bin/activate
    - uv pip install .[all,tests]
    - uv run pytest
  rules:
    - !reference [.merge_request_rules, rules]
  coverage: /TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/

mypy:
  stage: type_checking
  extends: .devsetup
  script:
    - pip install .[all,type_checker]
    - mypy src/spacecoords --follow-untyped-imports --disallow-untyped-defs --warn-unused-ignores
  rules:
    - !reference [.merge_request_rules, rules]

cyclomatic-complexity:
  stage: type_checking
  extends: .devsetup
  script:
    - pip install .[all,type_checker]
    - xenon src/spacecoords/ -m C -a A # Average of a file (-m): max C, Total average (-a): max A
  rules:
    - !reference [.merge_request_rules, rules]

###############
## Releasing ##

# Compile documentation for publication
pages:
  stage: release
  extends: .devsetup
  script:
    - pip install .[all,develop]
    - mkdocs build --site-dir public
  artifacts:
    paths:
      - public
  only:
    - tags

# Build and check integrity of distribution
# Then publish package on public PyPI
pypi:
  stage: release
  extends: .devsetup
  variables:
    #Use a gitlab variable to securely store the token
    PYPI_TOKEN: $PYPI_TOKEN
  script:
    - pip install .[all,develop]
    - python -m build
    - python -m twine check dist/*
    - >
      TWINE_USERNAME=__token__
      TWINE_PASSWORD=$PYPI_TOKEN
      python -m twine upload dist/*
  artifacts:
    paths:
      - dist/*
  only:
    - tags
